<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farm Capital</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #22541c; display: flex; justify-content: center; color: #fff; }
        #app {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 24px, transparent 24px, transparent 48px),
                        radial-gradient(circle at 50% 45%, #5eb33e 0%, #3d8526 70%, #2a6119 100%);
            display: flex; flex-direction: column; position: relative; overflow-x: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        @keyframes sway { 0%, 100% { transform: rotate(-6deg) scale(1.03); } 50% { transform: rotate(6deg) scale(0.97); } }
        @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.08, 0.92); } }
        @keyframes shakeTree { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-5deg); } 75% { transform: translateX(6px) rotate(5deg); } }
        @keyframes pickSwing { 0% { transform: rotate(0deg); } 35% { transform: rotate(-45deg) scale(1.15); } 70% { transform: rotate(35deg) scale(1.1); } 100% { transform: rotate(0deg); } }
        .sway { display: inline-block; transform-origin: bottom center; animation: sway 2.1s ease-in-out infinite; }
        .breathe { animation: breathe 1.9s ease-in-out infinite; }
        .shake { animation: shakeTree 0.4s ease-in-out; }
        .swing { display: inline-block; animation: pickSwing 0.55s ease-in-out infinite; }
        #splash {
            position: fixed; inset: 0; z-index: 999; max-width: 430px; margin: 0 auto;
            background: linear-gradient(180deg, #ffcf4d 0%, #e68a1e 55%, #8c4614 100%);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 36px 20px 44px; text-align: center; transition: opacity 0.4s;
        }
        .splash-title { font-size: 32px; font-weight: 900; text-shadow: 0 3px 0 #5c2a06; letter-spacing: 1px; }
        .splash-art { font-size: 92px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45)); }
        .load-wrap { width: 85%; background: #4a2308; border: 3px solid #f5c362; border-radius: 20px; padding: 4px; box-shadow: 0 6px 14px rgba(0,0,0,0.5); }
        .load-bar { height: 22px; width: 0%; background: linear-gradient(180deg, #ffe26a 0%, #e08b19 100%); border-radius: 14px; transition: width 0.15s; }
        .load-txt { font-weight: 900; font-size: 18px; margin-bottom: 8px; text-shadow: 0 2px 3px #3b1904; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; gap: 8px; background: rgba(0,0,0,0.28); }
        .res-pill { background: rgba(25,45,20,0.85); border: 2px solid #76b852; border-radius: 20px; padding: 4px 12px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .xp-bar { width: 70px; height: 10px; background: #1e3b18; border-radius: 6px; overflow: hidden; }
        .xp-fill { height: 100%; background: #38b6ff; width: 30%; transition: width 0.3s; }
        .profile-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 12px; padding: 8px 10px; background: rgba(20,35,18,0.85); border-radius: 16px; border: 1px solid rgba(255,255,255,0.18); gap: 6px; }
        .user-info { display: flex; flex-direction: column; font-size: 12px; max-width: 115px; overflow: hidden; }
        .user-name { font-weight: bold; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-id { color: #a3c99a; font-size: 10px; }
        .btn-green { background: linear-gradient(180deg, #5cd647 0%, #379c26 100%); border: 2px solid #236b17; border-radius: 12px; color: #fff; font-weight: bold; padding: 7px 14px; font-size: 14px; cursor: pointer; }
        .btn-icon { border-radius: 12px; padding: 6px 10px; font-size: 16px; cursor: pointer; border: 2px solid rgba(255,255,255,0.3); font-weight: bold; }
        .btn-ton { background: #0098ea; color: #fff; }
        .btn-pass { background: #f5b027; color: #5c3300; }
        .buildings-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 12px; }
        .building-slot { background: rgba(38,85,28,0.78); border: 2px dashed #9be37d; border-radius: 14px; padding: 8px 4px; text-align: center; font-size: 11px; font-weight: bold; cursor: pointer; }
        .building-slot.built { background: #6e472b; border: 2px solid #d9a066; }
        .trees-grove { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px 12px 2px; position: relative; z-index: 2; }
        .tree-item { background: rgba(25, 60, 18, 0.45); border: 1px solid rgba(155, 227, 125, 0.3); border-radius: 10px; padding: 4px 2px; text-align: center; cursor: pointer; position: relative; }
        .tree-item.used { opacity: 0.42; filter: grayscale(40%); }
        .tree-emoji { font-size: 20px; display: inline-block; }
        .tree-cd { font-size: 8px; font-weight: bold; background: rgba(0,0,0,0.78); border-radius: 4px; padding: 1px 2px; margin-top: 1px; }
        .farm-zone { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 12px; flex: 1; gap: 10px; }
        .plots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; background: rgba(30,68,22,0.55); padding: 8px; border-radius: 14px; border: 2px solid rgba(140,212,108,0.35); }
        .plot { aspect-ratio: 1 / 1; background: repeating-linear-gradient(0deg, #5c3a21, #5c3a21 6px, #4a2e19 6px, #4a2e19 12px); border: 2px solid #3a2211; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .plot.locked { background: rgba(65,130,50,0.5); border: 2px dashed #9be37d; }
        .plot-icon { font-size: 24px; }
        .plot-timer { position: absolute; bottom: 2px; background: rgba(0,0,0,0.8); border-radius: 6px; padding: 1px 4px; font-size: 9px; font-weight: bold; }
        .side-actions { display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 4px; }
        .side-row-top { display: flex; gap: 10px; }
        .side-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 11px; font-weight: bold; text-shadow: 0 2px 3px rgba(0,0,0,0.7); }
        .side-btn span { font-size: 30px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
        .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px 10px 14px; background: rgba(18,35,15,0.92); border-top: 2px solid #589e3c; }
        .nav-item { background: #e8cfa6; border: 2px solid #8c5828; border-radius: 12px; padding: 6px 2px; text-align: center; color: #4a2c11; font-size: 11px; font-weight: bold; cursor: pointer; }
        .nav-item span { display: block; font-size: 20px; margin-bottom: 2px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { width: 100%; max-width: 390px; max-height: 84vh; background: #c99663; border: 4px solid #75461d; border-radius: 24px; padding: 16px; color: #4a280a; position: relative; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .modal-box.mine-theme { background: #2d3846; border-color: #54657a; color: #fff; }
        .modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #f2dfc4; border: 2px solid #8c5828; font-weight: bold; font-size: 16px; color: #5c330e; cursor: pointer; }
        .modal-title { text-align: center; font-size: 22px; font-weight: 900; margin: 0 0 10px; }
        .tabs-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: #f2dfc4; border: 2px solid #9c6635; border-radius: 16px; padding: 6px 14px; font-weight: bold; color: #5c330e; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #75461d; color: #fff; }
        .modal-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .card-item { background: #a87344; border: 2px solid #75461d; border-radius: 16px; padding: 12px; color: #fff; }
        .card-ads { background: linear-gradient(180deg, #52b83e 0%, #378a27 100%); border: 2px solid #1f5c14; border-radius: 16px; padding: 12px; color: #fff; }
        .card-btn { width: 100%; margin-top: 8px; padding: 8px; background: #f2dfc4; border: 2px solid #75461d; border-radius: 12px; color: #4a280a; font-weight: bold; font-size: 14px; cursor: pointer; }
        .card-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .filter-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .filter-sel { background: #f2dfc4; border: 2px solid #75461d; border-radius: 12px; padding: 6px 4px; font-weight: bold; color: #4a280a; font-size: 12px; }
        .pass-row { display: grid; grid-template-columns: 1fr 38px 1fr; gap: 6px; align-items: center; background: #e8cfa6; border: 2px solid #8c5828; border-radius: 14px; padding: 6px; text-align: center; font-size: 12px; color: #4a280a; }
        .pass-lvl { width: 34px; height: 34px; border-radius: 50%; background: #d9a043; border: 2px solid #75461d; display: flex; align-items: center; justify-content: center; font-weight: 900; margin: 0 auto; }
        .mine-res-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 8px; }
        .mine-pill { background: #1e2630; border: 2px solid #48586b; border-radius: 12px; padding: 6px; font-weight: bold; font-size: 13px; }
        .toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: #f2dfc4; color: #4a280a; border: 3px solid #75461d; border-radius: 18px; padding: 10px 24px; font-weight: 900; font-size: 16px; z-index: 200; display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    </style>
</head>
<body>
<div id="splash">
    <div class="splash-title">FARM CAPITAL</div>
    <div class="splash-art breathe">🐔🌾💎</div>
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
        <div class="load-txt">Загрузка...</div>
        <div class="load-wrap"><div class="load-bar" id="loadBar"></div></div>
    </div>
</div>
<div class="toast" id="toastBox">Уведомление</div>
<div id="app">
    <div class="top-bar">
        <div class="res-pill">⭐ <span id="uiLevel">1</span> <div class="xp-bar"><div class="xp-fill" id="uiXpBar"></div></div></div>
        <div class="res-pill">🪙 <span id="uiCoins">200</span></div>
        <div class="res-pill">💎 <span id="uiGems">14</span></div>
    </div>
    <div class="profile-row">
        <div class="user-info">
            <div class="user-name" id="uiUserName">@Player</div>
            <div class="user-id" id="uiUserId">#100001</div>
        </div>
        <button class="btn-green" onclick="openModal('shop', 0)">Магазин</button>
        <button class="btn-icon btn-ton" onclick="openModal('wallet')">💠</button>
        <button class="btn-icon btn-pass" onclick="openModal('pass')">🎫</button>
    </div>
    <div class="buildings-row" id="buildingsRow"></div>
    <div class="trees-grove" id="treesGrove"></div>
    <div class="farm-zone">
        <div class="plots-grid" id="plotsGrid"></div>
        <div class="side-actions">
            <div class="side-row-top">
                <div class="side-btn" onclick="openModal('contests')"><span>🏆</span>Конкурсы</div>
                <div class="side-btn" onclick="openModal('bonus', 0)"><span>🎁</span>Бонус</div>
            </div>
            <div class="side-btn" onclick="openModal('mine')"><span>🪜</span>Шахта</div>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item" onclick="openModal('tasks', 0)"><span>📋</span>Задания</div>
        <div class="nav-item" onclick="openModal('barn', 0)"><span>🎒</span>Склад</div>
        <div class="nav-item" onclick="openModal('market')"><span>🏪</span>Маркет</div>
        <div class="nav-item" onclick="openModal('friends')"><span>👥</span>Друзья</div>
        <div class="nav-item" onclick="openModal('leaders')"><span>🏆</span>Лидеры</div>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
    <div class="modal-box" id="modalBox">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 class="modal-title" id="modalTitle">Окно</h2>
        <div class="tabs-row" id="modalTabs"></div>
        <div class="modal-scroll" id="modalBody"></div>
    </div>
</div>
<script>
    const GAME_CONFIG = {
        crops: {
            wheat:    { name: 'Пшеница',  icon: '🌾', buyPrice: 50,  sellPrice: 15, yield: 5,  time: 60,  reqLvl: 1,  xp: 5 },
            corn:     { name: 'Кукуруза', icon: '🌽', buyPrice: 90,  sellPrice: 22, yield: 8,  time: 120, reqLvl: 1,  xp: 10 },
            mushroom: { name: 'Грибы',    icon: '🍄', buyPrice: 120, sellPrice: 30, yield: 7,  time: 240, reqLvl: 5,  xp: 9 },
            carrot:   { name: 'Морковь',  icon: '🥕', buyPrice: 150, sellPrice: 38, yield: 10, time: 360, reqLvl: 9,  xp: 13 },
            melon:    { name: 'Арбуз',    icon: '🍉', buyPrice: 200, sellPrice: 55, yield: 12, time: 600, reqLvl: 15, xp: 16 },
            banana:   { name: 'Банан',    icon: '🍌', buyPrice: 250, sellPrice: 70, yield: 15, time: 900, reqLvl: 22, xp: 22 }
        },
        buildings: [
            { id: 'coop',  name: 'Курятник', icon: '🐔', cost: 5000,  income: '+0.075 TON/3ч' },
            { id: 'barn',  name: 'Коровник', icon: '🐮', cost: 10000, income: '+0.15 TON/4ч' },
            { id: 'sheep', name: 'Овчарня',  icon: '🐑', cost: 25000, income: '+0.30 TON/6ч' }
        ],
        marketItems: [
            { id: 'm1', type: 'Курица', icon: '🐔', lvl: 4, income: '+0.075 TON/3ч', price: 30 },
            { id: 'm2', type: 'Корова', icon: '🐮', lvl: 4, income: '+0.15 TON/4ч',  price: 68 },
            { id: 'm3', type: 'Овца',   icon: '🐑', lvl: 4, income: '+0.30 TON/6ч',  price: 120 }
        ],
        partnerTasks: [
            { id: 'pt1', title: 'Партнёрский канал #1', desc: 'Подпишись на канал, затем нажми «Проверить».', link: 'https://t.me' + '/serz11_minifarm_bot', coins: 200, gems: 1, xp: 25 },
            { id: 'pt2', title: 'Партнёрский канал #2', desc: 'Подпишись на канал, затем нажми «Проверить».', link: 'https://t.me' + '/serz11_minifarm_bot', coins: 200, gems: 1, xp: 25 },
            { id: 'pt3', title: 'Партнёрский канал #3', desc: 'Подпишись на канал, затем нажми «Проверить».', link: 'https://t.me' + '/serz11_minifarm_bot', coins: 300, gems: 2, xp: 25 },
            { id: 'pt4', title: 'Партнёрский канал #4', desc: 'Слот свободен — ссылку поставим позже.', link: 'https://t.me' + '/serz11_minifarm_bot', coins: 200, gems: 1, xp: 25 },
            { id: 'pt5', title: 'Партнёрский канал #5', desc: 'Слот свободен — ссылку поставим позже.', link: 'https://t.me' + '/serz11_minifarm_bot', coins: 200, gems: 1, xp: 25 }
        ],
        promoCodes: { 'FARM2026': { coins: 500, gems: 5, xp: 50 } },
        dailyRiddle: { question: 'Что растёт на поле и имеет золотые колосья?', answer: 'пшеница', coins: 200, gems: 1, xp: 25 },
        skipCostGems: 5,
        tonWalletAddress: 'UQA71KYG1Bei...ВашКошелекTON'
    };
    let loadPct = 0;
    const loadTimer = setInterval(() => {
        loadPct += 25;
        document.getElementById('loadBar').style.width = Math.min(100, loadPct) + '%';
        if (loadPct >= 100) {
            clearInterval(loadTimer);
            setTimeout(() => { const sp = document.getElementById('splash'); sp.style.opacity = '0'; setTimeout(() => sp.style.display = 'none', 400); }, 200);
        }
    }, 150);

    let tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user || null;
    if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
    const guestId = localStorage.getItem('fc_guest_id') || (() => { const id = String(Math.floor(100000000 + Math.random() * 900000000)); localStorage.setItem('fc_guest_id', id); return id; })();
    const playerId = tgUser?.id ? String(tgUser.id) : guestId;
    const SAVE_KEY = 'farmCapitalFull_' + playerId;

    if (tgUser) {
        document.getElementById('uiUserName').innerText = tgUser.username ? '@' + tgUser.username : tgUser.first_name;
        document.getElementById('uiUserId').innerText = '#' + tgUser.id;
    }

    let saved = JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
    const todayStr = new Date().toDateString();
    const isNewDay = saved.lastDay !== todayStr;

    let state = {
        lastDay: todayStr,
        coins: saved.coins ?? 200, gems: saved.gems ?? 14, level: saved.level ?? 1, xp: saved.xp ?? 55,
        adsToday: isNewDay ? 50 : (saved.adsToday ?? 50),
        trees: Array.isArray(saved.trees) && saved.trees.length === 12 ? saved.trees : Array.from({ length: 12 }, () => ({ readyAt: 0 })),
        mine: {
            gold: saved.mine?.gold ?? 0,
            crystal: saved.mine?.crystal ?? 0,
            coal: saved.mine?.coal ?? 0,
            miningEnd: saved.mine?.miningEnd ?? 0,
            failStreak: saved.mine?.failStreak ?? 0,
            stats: { speed: saved.mine?.stats?.speed ?? 0, energy: saved.mine?.stats?.energy ?? 0, luck: saved.mine?.stats?.luck ?? 0 }
        },
        seeds: saved.seeds ?? { wheat: 2, corn: 0, mushroom: 0, carrot: 0, melon: 0, banana: 0 },
        harvest: saved.harvest ?? { wheat: 0, corn: 0, mushroom: 0, carrot: 0, melon: 0, banana: 0 },
        built: saved.built ?? {}, doneTasks: saved.doneTasks ?? {}, usedPromos: saved.usedPromos ?? {},
        riddleDone: isNewDay ? false : (saved.riddleDone ?? false),
        plots: saved.plots ?? Array.from({ length: 16 }, (_, i) => ({ unlocked: i < 4, crop: null, timeLeft: 0 }))
    };
    const saveGame = () => localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    const getNextPlotCost = () => (state.plots.filter(p => p.unlocked).length - 3) * 150;
    function fmtTime24(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function getDayResetTimer() {
        const now = new Date();
        const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
        return fmtTime24(Math.max(0, Math.floor((midnight - now) / 1000)));
    }

    function shakeTree(idx) {
        const now = Math.floor(Date.now() / 1000);
        const tree = state.trees[idx];
        const icon = document.getElementById('treeIcon_' + idx);
        if (icon) { icon.classList.remove('shake'); void icon.offsetWidth; icon.classList.add('shake'); }
        if ((tree.readyAt || 0) > now) return showToast('Дерево восстанавливается...');

        tree.readyAt = now + 86400;
        if (Math.random() < 0.65) {
            const r = Math.random();
            let drop = 'wheat';
            if (r >= 0.92) drop = 'carrot';
            else if (r >= 0.78) drop = 'mushroom';
            else if (r >= 0.55) drop = 'corn';
            state.seeds[drop] = (state.seeds[drop] || 0) + 1;
            showToast(`🌳 Упало: ${GAME_CONFIG.crops[drop].icon} ${GAME_CONFIG.crops[drop].name}!`);
        } else {
            showToast('🌳 Пусто... Восстановится через 24ч');
        }
        saveGame(); renderMain();
    }

    function renderMain() {
        document.getElementById('uiCoins').innerText = state.coins;
        document.getElementById('uiGems').innerText = state.gems;
        document.getElementById('uiLevel').innerText = state.level;
        document.getElementById('uiXpBar').style.width = Math.min(100, Math.round((state.xp / (state.level * 100)) * 100)) + '%';

        const bRow = document.getElementById('buildingsRow');
        bRow.innerHTML = '';
        GAME_CONFIG.buildings.forEach(b => {
            const isBuilt = !!state.built[b.id];
            const div = document.createElement('div');
            div.className = 'building-slot' + (isBuilt ? ' built breathe' : '');
            div.innerHTML = isBuilt ? `${b.icon} ${b.name}<br><span style="color:#a3ff8f">Построено</span>` : `Построить<br>${b.name.toLowerCase()} (${b.cost / 1000}K)`;
            div.onclick = () => {
                if (state.built[b.id]) return showToast(`${b.name}: ${b.income}`);
                if (state.coins < b.cost) return showToast(`Нужно ${b.cost} 🪙`);
                state.coins -= b.cost; state.built[b.id] = true; saveGame(); renderMain();
            };
            bRow.appendChild(div);
        });

        const grove = document.getElementById('treesGrove');
        const nowSec = Math.floor(Date.now() / 1000);
        grove.innerHTML = '';
        state.trees.forEach((t, i) => {
            const left = Math.max(0, (t.readyAt || 0) - nowSec);
            const item = document.createElement('div');
            item.className = 'tree-item' + (left > 0 ? ' used' : '');
            item.innerHTML = `<span class="tree-emoji ${left === 0 ? 'sway' : ''}" id="treeIcon_${i}">🌳</span>` + (left > 0 ? `<div class="tree-cd">${fmtTime24(left)}</div>` : '');
            item.onclick = () => shakeTree(i);
            grove.appendChild(item);
        });
        const grid = document.getElementById('plotsGrid');
        grid.innerHTML = '';
        const nextLockedIdx = state.plots.findIndex(p => !p.unlocked);

        state.plots.forEach((plot, idx) => {
            const div = document.createElement('div');
            div.className = 'plot' + (plot.unlocked ? '' : ' locked');
            if (!plot.unlocked) {
                if (idx === nextLockedIdx) div.innerHTML = `<div class="plot-icon" style="font-size:28px;font-weight:900;">+</div>`;
            } else if (!plot.crop) {
                div.innerHTML = `<div class="plot-icon" style="opacity:0.35">🌱</div>`;
            } else if (plot.timeLeft > 0) {
                const m = String(Math.floor(plot.timeLeft / 60)).padStart(2, '0'), s = String(plot.timeLeft % 60).padStart(2, '0');
                div.innerHTML = `<div class="plot-icon sway">🌿</div><div class="plot-timer">${m}:${s}</div>`;
            } else {
                div.innerHTML = `<div class="plot-icon sway">${GAME_CONFIG.crops[plot.crop].icon}</div><div class="plot-timer" style="background:#2d8a22">Собрать</div>`;
            }
            div.onclick = () => onPlotClick(idx, nextLockedIdx);
            grid.appendChild(div);
        });
    }

    function onPlotClick(idx, nextLockedIdx) {
        const plot = state.plots[idx];
        if (!plot.unlocked) { if (idx === nextLockedIdx) openConfirmDialog('buyPlot', idx); return; }
        if (plot.crop && plot.timeLeft > 0) { openConfirmDialog('skipGrow', idx); return; }
        if (plot.crop && plot.timeLeft === 0) {
            const c = GAME_CONFIG.crops[plot.crop];
            state.harvest[plot.crop] = (state.harvest[plot.crop] || 0) + c.yield;
            addXp(c.xp); plot.crop = null; saveGame(); renderMain(); return;
        }
        const available = Object.keys(state.seeds).filter(k => (state.seeds[k] || 0) > 0);
        if (!available.length) return openModal('shop', 0);
        openSeedPicker(idx);
    }

    function openSeedPicker(plotIdx) {
        document.getElementById('modalBox').classList.remove('mine-theme');
        const title = document.getElementById('modalTitle'), tabs = document.getElementById('modalTabs'), body = document.getElementById('modalBody');
        tabs.innerHTML = ''; body.innerHTML = ''; title.innerText = 'Выберите семена';
        document.getElementById('modalOverlay').classList.add('active');
        Object.entries(GAME_CONFIG.crops).forEach(([k, c]) => {
            const cnt = state.seeds[k] || 0;
            if (cnt > 0) body.innerHTML += `<div class="card-item"><b>${c.icon} ${c.name}</b> (В наличии: ${cnt} шт. | Рост: ${c.time}с)<button class="card-btn" onclick="plantOnPlot(${plotIdx}, '${k}')">Посадить</button></div>`;
        });
    }

    function addXp(amount) { state.xp += amount; while (state.xp >= state.level * 100) { state.xp -= state.level * 100; state.level++; } }
    function showToast(txt) { const t = document.getElementById('toastBox'); t.innerText = txt; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1800); }

    function startMineCycle() {
        const now = Math.floor(Date.now() / 1000);
        if ((state.mine.miningEnd || 0) > now) return;
        const m = state.mine; m.miningEnd = now + 4 * 3600;
        m.coal += 15 + m.stats.speed * 2; m.gold += 4 + m.stats.energy;
        if (Math.random() < 0.35 + m.stats.luck * 0.03) m.crystal += 10 + m.stats.luck;
        saveGame(); openModal('mine');
    }

        }
    }

    function doPickUpgrade() { const m = state.mine; if (state.gems < 25 || state.coins < 2000 || m.coal < 60) return showToast('Нужно 25 💎, 2000 🪙 и 60 🪨'); state.gems -= 25; state.coins -= 2000; m.coal -= 60; if (Math.random() < 0.75 || m.failStreak >= 5) { m.failStreak = 0; const keys = ['speed', 'energy', 'luck'].filter(k => m.stats[k] < 20); if (keys.length) { const k = keys[Math.floor(Math.random() * keys.length)]; m.stats[k]++; } showToast('Успех! Качество кирки повышено!'); } else { m.failStreak++; showToast(`Неудача (${m.failStreak}/5)!`); } saveGame(); renderMain(); openModal('mine'); }
    function doMineExchange(kind) { const m = state.mine; if (kind === 'gold') { const c = Math.floor(m.gold / 2); if (!c) return showToast('Нужно минимум 2 золота!'); m.gold -= c * 2; state.coins += c; showToast(`Получено +${c} 🪙`); } else { const g = Math.floor(m.crystal / 60); if (!g) return showToast('Нужно минимум 60 кристаллов!'); m.crystal -= g * 60; state.gems += g; showToast(`Получено +${g} 💎`); } saveGame(); renderMain(); openModal('mine'); }
    function filterMarket() { const t = document.getElementById('fType')?.value || 'all', l = document.getElementById('fLvl')?.value || 'all', s = document.getElementById('fSort')?.value || 'asc'; let list = GAME_CONFIG.marketItems.filter(x => (t === 'all' || x.type === t) && (l === 'all' || String(x.lvl) === l)); list.sort((a, b) => s === 'asc' ? a.price - b.price : b.price - a.price); const box = document.getElementById('marketList'); if (box) box.innerHTML = list.length ? list.map(x => `<div class="card-item" style="margin-bottom:8px;"><b>${x.icon} ${x.type} LVL ${x.lvl}</b> (${x.income})<button class="card-btn" onclick="showToast('Покупка за TON настраивается с Сарой')">Купить (${x.price} 💎)</button></div>`).join('') : `<div style="text-align:center;padding:12px;">Подходящих животных пока нет.</div>`; }
    function plantFromBarn(k) { const ep = state.plots.find(p => p.unlocked && !p.crop); if (!ep) return showToast('Нет свободных грядок!'); if ((state.seeds[k] || 0) <= 0) return; state.seeds[k]--; ep.crop = k; ep.timeLeft = GAME_CONFIG.crops[k].time; saveGame(); renderMain(); closeModal(); }
    function watchAd() { if (state.adsToday <= 0) return; state.adsToday--; state.coins += 100; state.gems += 1; addXp(25); saveGame(); renderMain(); openModal('tasks', 1); }
    function activatePromo() { const code = (document.getElementById('promoIn')?.value || '').trim().toUpperCase(); const p = GAME_CONFIG.promoCodes[code]; if (!p) return showToast('Неверный промокод!'); if (state.usedPromos[code]) return showToast('Промокод уже использован!'); state.usedPromos[code] = true; state.coins += p.coins; state.gems += p.gems; addXp(p.xp); saveGame(); renderMain(); showToast(`+${p.coins} 🪙, +${p.gems} 💎!`); closeModal(); }
    function copyText(txt) { navigator.clipboard?.writeText(txt); showToast('Ссылка скопирована!'); }
    function doPartner(id, link, c, g, x) { window.open(link, '_blank'); state.doneTasks[id] = true; state.coins += c; state.gems += g; addXp(x); saveGame(); renderMain(); openModal('tasks', 1); }
    function claimTask(id, c, g, x) { state.doneTasks[id] = true; state.coins += c; state.gems += g; addXp(x); saveGame(); renderMain(); openModal('tasks', 0); }
    function buySeed(k) { const c = GAME_CONFIG.crops[k]; if (state.coins < c.buyPrice) return showToast('Недостаточно монет!'); state.coins -= c.buyPrice; state.seeds[k] = (state.seeds[k] || 0) + 1; saveGame(); renderMain(); openModal('shop', 0); }
    function sellOne(k) { const cnt = state.harvest[k] || 0; if (!cnt) return; state.coins += cnt * GAME_CONFIG.crops[k].sellPrice; state.harvest[k] = 0; saveGame(); renderMain(); openModal('barn', 1); }
    function sellAll() { let s = 0; Object.keys(GAME_CONFIG.crops).forEach(k => { s += (state.harvest[k] || 0) * GAME_CONFIG.crops[k].sellPrice; state.harvest[k] = 0; }); if (!s) return showToast('Склад пуст!'); state.coins += s; saveGame(); renderMain(); openModal('barn', 1); }
    function checkRiddle() { const v = (document.getElementById('rIn')?.value || '').trim().toLowerCase(); const r = GAME_CONFIG.dailyRiddle; if (v === r.answer) { state.coins += r.coins; state.gems += r.gems; addXp(r.xp); state.riddleDone = true; saveGame(); renderMain(); openModal('bonus', 0); } else showToast('Неверно! Подсказка: пшеница'); }
    const closeModal = () => document.getElementById('modalOverlay').classList.remove('active');
    const closeModalOnBg = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
    setInterval(() => { const curDay = new Date().toDateString(); if (state.lastDay !== curDay) { state.lastDay = curDay; state.adsToday = 50; state.riddleDone = false; saveGame(); } document.querySelectorAll('.day-timer').forEach(el => el.innerText = getDayResetTimer()); let u = false; state.plots.forEach(p => { if (p.crop && p.timeLeft > 0) { p.timeLeft--; u = true; } }); if (u) saveGame(); renderMain(); if (document.getElementById('modalOverlay').classList.contains('active') && document.getElementById('modalTitle').innerText === 'Шахта') openModal('mine'); }, 1000);
    renderMain();
</script>
</body>
</html>
