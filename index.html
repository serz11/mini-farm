        treeCd: saved.treeCd ?? { t1: 0, t2: 0, t3: 0, t4: 0, t5: 0, t6: 0 },

    function fmtTime(sec) {
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        const pad = n => String(n).padStart(2, '0');
        return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    (function runSplash() {
        let p = 0; const bar = document.getElementById('loadBar'), sp = document.getElementById('splash');
        const iv = setInterval(() => {
            p += 25; if (bar) bar.style.width = Math.min(100, p) + '%';
            if (p >= 100) { clearInterval(iv); setTimeout(() => { if (sp) { sp.style.opacity = '0'; setTimeout(() => sp.remove(), 350); } }, 200); }
        }, 120);
    })();
    function renderMain() {
        document.getElementById('uiCoins').innerText = state.coins;
        document.getElementById('uiGems').innerText = state.gems;
        document.getElementById('uiLevel').innerText = state.level;
        document.getElementById('uiXpBar').style.width = Math.min(100, Math.round((state.xp / (state.level * 100)) * 100)) + '%';

        const bRow = document.getElementById('buildingsRow'); bRow.innerHTML = '';
        GAME_CONFIG.buildings.forEach(b => {
            const isBuilt = !!state.built[b.id], div = document.createElement('div');
            div.className = 'building-slot' + (isBuilt ? ' built' : '');
            div.innerHTML = isBuilt ? `${b.icon} ${b.name}<br><span style="color:#a3ff8f">Построено</span>` : `Построить<br>${b.name.toLowerCase()} (${b.cost / 1000}K)`;
            div.onclick = () => {
                if (state.built[b.id]) return showToast(`${b.name}: ${b.income}`);
                if (state.coins < b.cost) return showToast(`Нужно ${b.cost} 🪙`);
                state.coins -= b.cost; state.built[b.id] = true; saveGame(); renderMain();
            };
            bRow.appendChild(div);
        });

        const tRow = document.getElementById('treesGrove'); tRow.innerHTML = '';
        GAME_CONFIG.trees.forEach(t => {
            const cd = state.treeCd[t.id] || 0, div = document.createElement('div');
            div.className = 'tree-item' + (cd > 0 ? ' used' : '');
            div.innerHTML = `<span class="tree-emoji ${cd===0?'sway':''}">${t.icon}</span><div class="tree-cd">${cd > 0 ? fmtTime(cd) : 'Трясти'}</div>`;
            div.onclick = () => shakeTreeBonus(t, div);
            tRow.appendChild(div);
        });

        const grid = document.getElementById('plotsGrid'); grid.innerHTML = '';
        const nextLockedIdx = state.plots.findIndex(p => !p.unlocked);
        state.plots.forEach((plot, idx) => {
            const div = document.createElement('div');
            div.className = 'plot' + (plot.unlocked ? '' : ' locked');

                if (idx === nextLockedIdx) div.innerHTML = `<div class="plot-icon" style="font-size:28px;font-weight:900;">+</div>`;
            } else if (!plot.crop) {
                div.innerHTML = `<div class="plot-icon" style="opacity:0.35">🌱</div>`;
            } else if (plot.timeLeft > 0) {
                div.innerHTML = `<div class="plot-icon">🌿</div><div class="plot-timer">${fmtTime(plot.timeLeft)}</div>`;
            } else {
                div.innerHTML = `<div class="plot-icon">${GAME_CONFIG.crops[plot.crop].icon}</div><div class="plot-timer" style="background:#2d8a22">Собрать</div>`;
            }
            div.onclick = () => onPlotClick(idx, nextLockedIdx);
            grid.appendChild(div);
        });
    }
    function shakeTreeBonus(t, el) {
        if ((state.treeCd[t.id] || 0) > 0) return showToast(`Дерево отдыхает (${fmtTime(state.treeCd[t.id])})`);
        el.classList.add('shake');
        state.treeCd[t.id] = t.cooldown;
        const rnd = Math.random();
        if (rnd < 0.45) {
            const cKeys = Object.keys(GAME_CONFIG.crops);
            const k = cKeys[Math.floor(Math.random() * Math.min(3, cKeys.length))];
            state.seeds[k] = (state.seeds[k] || 0) + 1;
            showToast(`Упало семечко: ${GAME_CONFIG.crops[k].icon} ${GAME_CONFIG.crops[k].name}!`);
        } else if (rnd < 0.85) {
            const bonus = 25 + state.level * 5;
            state.coins += bonus;
            showToast(`С дерева упало +${bonus} 🪙!`);
        } else {
            state.gems += 1;
            showToast('Редкая находка: +1 💎!');
        }
        addXp(10); saveGame(); setTimeout(renderMain, 380);
    }

    function onPlotClick(idx, nextLockedIdx) {
        const plot = state.plots[idx];
        if (!plot.unlocked) { if (idx === nextLockedIdx) openConfirmDialog('buyPlot', idx); return; }
        if (plot.crop && plot.timeLeft > 0) { openConfirmDialog('growOpts', idx); return; }
        if (plot.crop && plot.timeLeft === 0) {
            const c = GAME_CONFIG.crops[plot.crop];
            state.harvest[plot.crop] = (state.harvest[plot.crop] || 0) + c.yield;
            addXp(c.xp); plot.crop = null; saveGame(); renderMain(); return;
        }
        const availSeeds = Object.keys(state.seeds).filter(k => state.seeds[k] > 0);
        if (!availSeeds.length) return openModal('shop', 0);
        if (availSeeds.length === 1) { plantSeedOnPlot(idx, availSeeds[0]); return; }
        openSeedPicker(idx);
    }

        const box = document.getElementById('modalBox'), title = document.getElementById('modalTitle'), tabs = document.getElementById('modalTabs'), body = document.getElementById('modalBody');

    }

    function showToast(txt) { const t = document.getElementById('toastBox'); t.innerText = txt; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1900); }

    function openConfirmDialog(kind, idx) {
        const box = document.getElementById('modalBox'), title = document.getElementById('modalTitle'), tabs = document.getElementById('modalTabs'), body = document.getElementById('modalBody');
        box.classList.remove('pond-theme', 'mine-theme'); tabs.innerHTML = '';

                <div class="card-item"><b>🌱 Простой компост (-20% времени)</b><br>В наличии: ${state.fertWeak} шт.<button class="card-btn" ${state.fertWeak<=0?'disabled':''} onclick="useFert(${idx},'weak')">Применить (-20%)</button></div>
                <div class="card-item"><b>🧪 Рыбный концентрат (-50% времени)</b><br>В наличии: ${state.fertStrong} шт.<button class="card-btn" ${state.fertStrong<=0?'disabled':''} onclick="useFert(${idx},'strong')">Применить (-50%)</button></div>
                <div class="card-item"><b>✨ Эликсир роста (Мгновенно)</b><br>В наличии: ${state.fertInstant} шт.<button class="card-btn" ${state.fertInstant<=0?'disabled':''} onclick="useFert(${idx},'instant')">Созреть сразу</button></div>
                <div class="card-item"><b>💎 Ускорить за ${GAME_CONFIG.skipCostGems} гемов</b><button class="card-btn" onclick="confirmSkipGrow(${idx})">Ускорить за ${GAME_CONFIG.skipCostGems} 💎</button></div>`;
        }
    }
    function useFert(idx, mode) {
        if (mode === 'weak' && state.fertWeak > 0) { state.fertWeak--; state.plots[idx].timeLeft = Math.floor(state.plots[idx].timeLeft * 0.8); showToast('Время сокращено на 20%!'); }
        else if (mode === 'strong' && state.fertStrong > 0) { state.fertStrong--; state.plots[idx].timeLeft = Math.floor(state.plots[idx].timeLeft * 0.5); showToast('Время сокращено вдвое!'); }

    let fishPinPos = 0, fishPinDir = 1, fishTimer = null, biteTimeout = null;
    function stopFishLoop() {
        if (fishTimer) { clearInterval(fishTimer); fishTimer = null; }
        if (biteTimeout) { clearTimeout(biteTimeout); biteTimeout = null; }
    }

    function renderPondModal(subTab, title, tabs, body) {

        box.classList.remove('mine-theme'); box.classList.add('pond-theme');

    function startCast() {
        if ((state.baits[state.activeBait] || 0) <= 0) return showToast('Нет наживки!');
        const btn = document.getElementById('castBtn'), bob = document.getElementById('bobberIcon'), wrap = document.getElementById('bobberWrap'), st = document.getElementById('pondStatus');
        if (btn) btn.disabled = true;
        if (bob) { bob.innerText = '🎏'; bob.classList.remove('bite'); }
        if (wrap) wrap.classList.remove('bite');
        if (st) st.innerText = 'Поплавок на воде... Ждём поклёвку...';
        stopFishLoop();
        biteTimeout = setTimeout(() => {
            if (bob) bob.classList.add('bite');
            if (wrap) wrap.classList.add('bite');
            if (st) st.innerText = '❗ КЛЮЁТ! Жми подсечку!';
            showHookGauge();
        }, 1200 + Math.random() * 1400);
    }

     function showHookGauge() {
        const rod = GAME_CONFIG.rods.find(r => r.id === state.activeRod) || { zone: 28, starBonus: 0 };
        const zWidth = rod.zone || 28;
        const zStart = Math.round(50 - zWidth / 2);
        const wrap = document.getElementById('gaugeWrap'), btn = document.getElementById('castBtn');
        if (!wrap) return;
        wrap.innerHTML = `<div class="fish-gauge"><div class="fish-zone" style="left:${zStart}%;width:${zWidth}%;"></div><div class="fish-pin" id="fishPin" style="left:0%;"></div></div>`;
        if (btn) { btn.disabled = false; btn.style.background = '#ecc94b'; btn.style.color = '#4a280a'; btn.innerText = '⚡ ПОДСЕЧЬ!'; btn.onclick = () => catchFish(zStart, zWidth); }
        fishPinPos = 0; fishPinDir = 1;
        fishTimer = setInterval(() => {
            fishPinPos += fishPinDir * 2.5;
            if (fishPinPos >= 96) { fishPinPos = 96; fishPinDir = -1; }
            if (fishPinPos <= 0) { fishPinPos = 0; fishPinDir = 1; }
            const el = document.getElementById('fishPin');
            if (el) el.style.left = fishPinPos + '%';
        }, 30);
    }

            state.fishBag.forEach(f => totalSell += f.price);
            body.innerHTML = `<div class="card-item" style="background:#1e4e8c;border-color:#63b3ed;"><button class="card-btn" style="background:#ffe299;margin:0;" ${!state.fishBag.length?'disabled':''} onclick="sellAllFish()">💰 Продать весь улов (${totalSell} 🪙)</button></div>`;

            state.fishBag.forEach((f, i) => {
                body.innerHTML += `<div class="card-item" style="background:#235796;border-color:#63b3ed;"><b>${f.icon} ${f.name}</b> ${'⭐'.repeat(f.stars)} (${f.rarity})<br>Цена: ${f.price} 🪙 | Очки компоста: +${f.compPts}<button class="card-btn" onclick="sellOneFish(${i})">Продать за ${f.price} 🪙</button></div>`;
            });
        } else if (subTab === 2) {
            Object.entries(GAME_CONFIG.baits).forEach(([k, b]) => {
                const cnt = state.baits[k] || 0, cropObj = GAME_CONFIG.crops[b.craftCrop], hasCrop = state.harvest[b.craftCrop] || 0, isAct = state.activeBait === k;
                body.innerHTML += `<div class="card-item" style="background:#235796;border-color:#63b3ed;">

                    </div>
                    <button class="card-btn" style="background:#bee3f8;" ${isAct?'disabled':''} onclick="selectBait('${k}')">${isAct?'Выбрана':'Выбрать наживку'}</button>

            });

            GAME_CONFIG.rods.forEach(r => {
                const owned = state.ownedRods.includes(r.id), isAct = state.activeRod === r.id, locked = state.level < r.reqLvl;
                body.innerHTML += `<div class="card-item" style="background:#235796;border-color:#63b3ed;">

                    <button class="card-btn" ${!owned && locked ? 'disabled' : ''} onclick="handleRod('${r.id}')">${isAct ? 'Используется' : (owned ? 'Взять в руки' : (locked ? 'С уровня ' + r.reqLvl : 'Купить за ' + r.price + ' 🪙'))}</button>
                </div>`;
            });
        }
    }

    function catchFish(zStart, zWidth) {
        const pinEl = document.getElementById('fishPin');
        const zoneEl = document.querySelector('.fish-zone');
        let hit = false;
        let perfect = false;
        if (pinEl && zoneEl) {
            const pRect = pinEl.getBoundingClientRect();
            const zRect = zoneEl.getBoundingClientRect();
            const pCenter = pRect.left + pRect.width / 2;
            hit = pCenter >= (zRect.left - 6) && pCenter <= (zRect.right + 6);
            const zCenter = zRect.left + zRect.width / 2;
            perfect = Math.abs(pCenter - zCenter) <= (zRect.width * 0.25);
        }
        stopFishLoop();
        if ((state.baits[state.activeBait] || 0) <= 0) return showToast('Закончилась наживка!');
        state.baits[state.activeBait]--;
        if (!hit) {
            saveGame();
            showToast('💨 Сорвалась! Попадите в зелёную зону');
            openModal('pond', 0);
            return;
        }
        const bait = GAME_CONFIG.baits[state.activeBait];
        const rod = GAME_CONFIG.rods.find(r => r.id === state.activeRod) || { zone: 28, starBonus: 0 };

        let pool = GAME_CONFIG.fishes.filter(f => f.tier <= bait.tier).map(f => {
            let w = f.weight;
            if (f.rarity === 'Мусор') w = Math.max(2, Math.round(w / bait.tier));
            if (f.tier === bait.tier && bait.tier > 1) w += 18;
            return { ...f, w };
        });
        const sumW = pool.reduce((a, b) => a + b.w, 0);
        let rnd = Math.random() * sumW, chosen = pool.at(0);
        for (const item of pool) { if (rnd < item.w) { chosen = item; break; } rnd -= item.w; }

        let stars = 1;
        if (chosen.rarity !== 'Мусор') {
            const starRoll = Math.random() * 100 + rod.starBonus + (perfect ? 25 : 0);
            if (starRoll > 125) stars = 5; else if (starRoll > 100) stars = 4; else if (starRoll > 75) stars = 3; else if (starRoll > 45) stars = 2;
        }
        const finalPrice = Math.round(chosen.basePrice * (1 + (stars - 1) * 0.25));
        state.fishBag.push({ id: chosen.id, name: chosen.name, icon: chosen.icon, rarity: chosen.rarity, stars, price: finalPrice, compPts: chosen.compPts * stars });
        addXp(perfect ? 18 : 8);
        saveGame(); renderMain();
        showToast(`${perfect ? '🎯 Идеально! ' : ''}${chosen.icon} ${chosen.name}${chosen.rarity!=='Мусор'?' ('+'⭐'.repeat(stars)+')':''}`);
        openModal('pond', 0);
    }


    function sellOneFish(i) { const f = state.fishBag[i]; if (!f) return; state.coins += f.price; state.fishBag.splice(i, 1); saveGame(); renderMain(); openModal('pond', 1); }
    function sellAllFish() { let s = 0; state.fishBag.forEach(f => s += f.price); if (!s) return; state.coins += s; state.fishBag = []; saveGame(); renderMain(); openModal('pond', 1); showToast(`Продано на ${s} 🪙!`); }
    function buyBait(k) { const b = GAME_CONFIG.baits[k]; if (state.coins < b.buyPrice) return showToast('Недостаточно монет!'); state.coins -= b.buyPrice; state.baits[k] = (state.baits[k] || 0) + 1; saveGame(); renderMain(); openModal('pond', 2); }
    function craftBait(k) { const b = GAME_CONFIG.baits[k]; if ((state.harvest[b.craftCrop] || 0) < b.craftQty) return showToast('Не хватает урожая на складе!'); state.harvest[b.craftCrop] -= b.craftQty; state.baits[k] = (state.baits[k] || 0) + 2; saveGame(); openModal('pond', 2); showToast(`Скрафчено 2 шт. ${b.icon}!`); }
    function selectBait(k) { state.activeBait = k; saveGame(); openModal('pond', 2); }
    function handleRod(id) {
        const r = GAME_CONFIG.rods.find(x => x.id === id);
        if (!state.ownedRods.includes(id)) {
            if (state.coins < r.price) return showToast(`Нужно ${r.price} 🪙`);

        }
        state.activeRod = id; saveGame(); renderMain(); openModal('pond', 3);
    }
    function renderCompostModal(title, body) {
        title.innerText = '♻️ Компостная яма';
        let fishPts = 0;
        state.fishBag.forEach(f => fishPts += f.compPts);
        body.innerHTML = `
            <div class="card-item" style="text-align:center;">

    function loadCropToCompost(k) { if ((state.harvest[k] || 0) <= 0) return; const pts = GAME_CONFIG.crops[k].compPts; state.harvest[k]--; state.compostPool += pts; saveGame(); openModal('compost'); }
    function makeFert(type, cost) {
        if (state.compostPool < cost) return showToast(`Нужно ${cost} pts!`);

    function upgMineStat(stat, cost) {
        const m = state.mine;
        if (state.coins < cost) return showToast(`Нужно ${cost} 🪙`);
        if (stat === 'speed' && m.speedLvl < 20) { state.coins -= cost; m.speedLvl++; m.cdLeft = Math.max(900, m.cdLeft - 300); }
        else if (stat === 'energy' && m.energyLvl < 20) { state.coins -= cost; m.energyLvl++; }
        else if (stat === 'luck' && m.luckLvl < 20) { state.coins -= cost; m.luckLvl++; }
        saveGame(); renderMain(); openMineUpgMenu(); showToast('Уровень характеристики повышен!');
    }

    function doMineEx(kind) {
        if (kind === 'gold') {
            const c = Math.floor(state.mine.gold / 2); if (c <= 0) return;
            state.mine.gold -= c * 2; state.coins += c; showToast(`Получено +${c} 🪙!`);
        } else {
            const g = Math.floor(state.mine.crystal / 60); if (g <= 0) return;
            state.mine.crystal -= g * 60; state.gems += g; showToast(`Получено +${g} 💎!`);
        }
        saveGame(); renderMain(); openModal('mine');
    }
    function getDailyResetStr() {
        const now = new Date(), end = new Date(now);
        end.setHours(24, 0, 0, 0);
        return fmtTime(Math.max(0, Math.floor((end - now) / 1000)));
    }

    function filterMarket() {
        const t = document.getElementById('fType')?.value || 'all', l = document.getElementById('fLvl')?.value || 'all', s = document.getElementById('fSort')?.value || 'asc';
        let list = GAME_CONFIG.marketItems.filter(x => (t === 'all' || x.type === t) && (l === 'all' || String(x.lvl) === l));
        list.sort((a, b) => s === 'asc' ? a.price - b.price : b.price - a.price);
        const box = document.getElementById('marketList');
        if (!box) return;
        box.innerHTML = list.length ? list.map(x => `<div class="card-item" style="margin-bottom:8px;"><b>${x.icon} ${x.type} LVL ${x.lvl}</b> (${x.income})<button class="card-btn" onclick="showToast('Покупка за TON настраивается с Сарой')">Купить (${x.price} 💎)</button></div>`).join('') : `<div style="text-align:center;padding:12px;">Подходящих животных пока нет.</div>`;
    }
    function plantFromBarn(k) { const ep = state.plots.find(p => p.unlocked && !p.crop); if (!ep) return showToast('Нет свободных грядок!'); if ((state.seeds[k] || 0) <= 0) return; state.seeds[k]--; ep.crop = k; ep.timeLeft = GAME_CONFIG.crops[k].time; saveGame(); renderMain(); closeModal(); }
    function watchAd() { if (state.adsToday <= 0) return; state.adsToday--; state.coins += 100; state.gems += 1; addXp(25); saveGame(); renderMain(); openModal('tasks', 1); }

    function copyText(txt) { navigator.clipboard?.writeText(txt); showToast('Ссылка скопирована!'); }
    function doPartner(id, link, c, g, x) { window.open(link, '_blank'); state.doneTasks[id] = true; state.coins += c; state.gems += g; addXp(x); saveGame(); renderMain(); openModal('tasks', 1); }
    function claimTask(id, c, g, x) { state.doneTasks[id] = true; state.coins += c; state.gems += g; addXp(x); saveGame(); renderMain(); if (!id.startsWith('pass_')) openModal('tasks', 0); }
    function buySeed(k) { const c = GAME_CONFIG.crops[k]; if (state.coins < c.buyPrice) return showToast('Недостаточно монет!'); state.coins -= c.buyPrice; state.seeds[k] = (state.seeds[k] || 0) + 1; saveGame(); renderMain(); openModal('shop', 0); }
    function sellOne(k) { const cnt = state.harvest[k] || 0; if (!cnt) return; state.coins += cnt * GAME_CONFIG.crops[k].sellPrice; state.harvest[k] = 0; saveGame(); renderMain(); openModal('barn', 1); }
    function sellAll() { let s = 0; Object.keys(GAME_CONFIG.crops).forEach(k => { s += (state.harvest[k] || 0) * GAME_CONFIG.crops[k].sellPrice; state.harvest[k] = 0; }); if (!s) return showToast('Склад пуст!'); state.coins += s; saveGame(); renderMain(); openModal('barn', 1); }
    function checkRiddle() { const v = (document.getElementById('rIn')?.value || '').trim().toLowerCase(); const r = GAME_CONFIG.dailyRiddle; if (v === r.answer) { state.coins += r.coins; state.gems += r.gems; addXp(r.xp); state.riddleDone = true; saveGame(); renderMain(); openModal('bonus', 0); } else showToast('Неверно! Подсказка: пшеница'); }
    const closeModal = () => { stopFishLoop(); document.getElementById('modalOverlay').classList.remove('active'); };
    const closeModalOnBg = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };

    setInterval(() => {
        let u = false;
        state.plots.forEach(p => { if (p.crop && p.timeLeft > 0) { p.timeLeft--; u = true; } });
        Object.keys(state.treeCd).forEach(k => { if (state.treeCd[k] > 0) { state.treeCd[k]--; u = true; } });
        if (state.mine.cdLeft > 0) {
            state.mine.cdLeft--; u = true;
            document.querySelectorAll('.mine-cd').forEach(el => el.innerText = fmtTime(state.mine.cdLeft));
            if (state.mine.cdLeft === 0) {
                const m = state.mine, mult = 1 + Math.floor(m.energyLvl / 4), luck = m.luckLvl * 0.03;
                m.gold += (2 + Math.floor(Math.random() * 3 + luck)) * mult;
                m.crystal += (5 + Math.floor(Math.random() * 8 + luck * 5)) * mult;
                m.coal += (10 + Math.floor(Math.random() * 10)) * mult;
                m.cdLeft = Math.max(900, 7500 - m.speedLvl * 300);
                if (document.getElementById('modalTitle')?.innerText === 'Шахта') openModal('mine');
            }
        }
        document.querySelectorAll('.daily-cd').forEach(el => el.innerText = getDailyResetStr());
        if (u) { saveGame(); renderMain(); }
    }, 1000);

    renderMain();
</script>
</body>
</html>
